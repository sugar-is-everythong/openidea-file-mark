id = "sugar-is-everythong.file-marks"
name = "File Marks 文件标记"
version = "0.1.1"
description = "文件树标注。Notes on the project tree. 在项目树的文件名后面写一句备注，所有备注在 File Marks 窗口按项目汇总列出；备注只存进项目根目录的 file-mark.json，这是本插件唯一写的文件——写成项目里的文件是为了多人开发：提交进仓库全组看到同一份，换台机器 clone 就带走，也能手改、可以 .gitignore。A note after a file's name in the project tree, every note listed per project in the File Marks window; notes live in the project's own file-mark.json, the only file this plugin writes — keeping them in the project is what makes them shared: commit them and the whole team reads the same remarks, clone elsewhere and they travel."
authors = ["sugar-is-everythong"]
license = "Apache-2.0"
categories = ["tools"]
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:file-marks"]

[capabilities]
required = ["project.read", "project.write"]

[[contributes.commands]]
id = "add-remark"
title = "Add Remark…"
category = "File Marks"

[[contributes.commands]]
id = "clear-mark"
title = "Clear"
category = "File Marks"

# Both entries of this plugin name the same `submenu`, so they are collected
# under it. The plugin API this IDE implements has no `group`, so there is no
# line between them and clearing sits right under the remark.
[[contributes.menus]]
menu = "projectView.context"
command = "add-remark"
submenu = "File Marks"

[[contributes.menus]]
menu = "projectView.context"
command = "clear-mark"
submenu = "File Marks"

# The tool window lists every project, so its rows carry a `mark:` key and only
# a row can be cleared from here; a folder shown for structure has a `dir:` key.
[[contributes.menus]]
menu = "viewItem.context"
view = "file-marks"
command = "clear-mark"
when = "viewItemKind == \"mark\""

[[contributes.views]]
id = "file-marks"
title = "File Marks"
icon = "tag"
location = "left"
